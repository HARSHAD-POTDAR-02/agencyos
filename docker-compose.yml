version: "3.9"

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: agencyos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agencyos
      POSTGRES_PASSWORD: agencyos_pass
      POSTGRES_DB: agencyos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencyos -d agencyos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (optional - DB GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agencyos_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agencyos.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # MinIO - S3-compatible local file storage
  minio:
    image: minio/minio:latest
    container_name: agencyos_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:
